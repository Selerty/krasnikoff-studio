<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0c0c0c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Страница не найдена — Krasnikoff Studio</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0c0c0c; color: #f5f5f5; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; }
      main { width: min(100%, 560px); text-align: center; }
      p { color: rgba(255,255,255,.66); line-height: 1.6; }
      a { display: inline-flex; margin-top: 20px; border-radius: 999px; background: #fff; padding: 12px 20px; color: #111; font-size: 14px; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid #a4f4fd; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Страница не найдена</h1>
      <p>Проверьте адрес или вернитесь на сайт Krasnikoff Studio.</p>
      <a href="/">На главную</a>
    </main>
  </body>
</html>
